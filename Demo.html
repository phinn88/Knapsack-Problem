<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Management System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .section { margin-bottom: 30px; }
        #resultSection { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Nhập số kho và hàng hóa -->
        <div class="section">
            <h2>Warehouse Management System</h2>
            <div class="row">
                <div class="col-md-6">
                    <label for="numWarehouses" class="form-label">Number of Warehouses:</label>
                    <input type="number" id="numWarehouses" class="form-control" min="1" placeholder="Enter number of warehouses">
                </div>
                <div class="col-md-6">
                    <label for="numItems" class="form-label">Number of Items:</label>
                    <input type="number" id="numItems" class="form-control" min="1" placeholder="Enter number of items">
                </div>
            </div>
            <button class="btn btn-primary mt-3" onclick="createInputTables()">Generate Input Tables</button>
        </div>

        <!-- Bảng nhập liệu kho -->
        <div class="section" id="warehouseTable"></div>

        <!-- Bảng nhập liệu hàng hóa -->
        <div class="section" id="itemTable"></div>

        <!-- Nút tính toán -->
        <div class="section">
            <button class="btn btn-success" onclick="generateResult()">Calculate Allocation</button>
        </div>

        <!-- Thêm hàng hóa -->
        <div class="section" id="addItemSection" style="display: none;">
            <h3>Add New Item</h3>
            <div class="row">
                <div class="col-md-6">
                    <input type="number" id="newItemProfit" class="form-control" placeholder="Profit" min="0">
                </div>
                <div class="col-md-6">
                    <input type="number" id="newItemWeight" class="form-control" placeholder="Weight (kg)" min="0">
                </div>
            </div>
            <button class="btn btn-primary mt-3" onclick="addItem()">Add Item</button>
        </div>

        <!-- Xóa hàng hóa -->
        <div class="section" id="removeItemSection" style="display: none;">
            <h3>Remove Item</h3>
            <input type="number" id="removeItemId" class="form-control" placeholder="Item ID">
            <button class="btn btn-danger mt-3" onclick="removeItem()">Remove Item</button>
        </div>

        <!-- Thêm nhà kho -->
        <div class="section" id="addWarehouseSection" style="display: none;">
            <h3>Add New Warehouse</h3>
            <input type="number" id="newWarehouseCapacity" class="form-control" placeholder="Capacity (kg)" min="0">
            <button class="btn btn-primary mt-3" onclick="addWarehouse()">Add Warehouse</button>
        </div>

        <!-- Xóa nhà kho -->
        <div class="section" id="removeWarehouseSection" style="display: none;">
            <h3>Remove Warehouse</h3>
            <input type="number" id="removeWarehouseIndex" class="form-control" placeholder="Warehouse Index">
            <button class="btn btn-danger mt-3" onclick="removeWarehouse()">Remove Warehouse</button>
        </div>

        <!-- Kết quả -->
        <div class="section" id="resultSection" style="visibility: hidden;">
            <h2>Results</h2>
            <div id="currentItemsTable"></div>
            <div id="multipleWarehousesResult"></div>
            <h3>Total Profit: <span id="kp01ResultantProfit"></span></h3>
            <button class="btn btn-warning mt-3" onclick="recalculate()">Recalculate Allocation</button>
        </div>
    </div>

    <!-- Bootstrap JS and main.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Demo.js"></script>
    <link rel="stylesheet" href="Demo.css">

</body>
</html>
